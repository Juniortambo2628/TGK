name: CI

# Test suite + autofixes. On success against main, the "Deploy (cPanel SSH)"
# workflow is triggered automatically via workflow_run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to push Pint autofix commits

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test & autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, xml, ctype, json, curl, tokenizer, openssl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy environment (testing)
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Prepare test database (sqlite)
        run: |
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env || true
          echo "DB_DATABASE=$PWD/database/database.sqlite" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          php artisan config:clear
          php artisan migrate --force

      - name: Laravel Pint (autofix)
        run: |
          vendor/bin/pint --test || true
          vendor/bin/pint || true

      - name: Commit Pint autofixes
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "style: apply Laravel Pint autofixes [skip ci]"
            git push
          fi

      - name: Frontend production build
        run: npm run build

      - name: Assert SEO/SSR build artifacts
        run: |
          test -f public/build/manifest.json
          test -f bootstrap/ssr/index.mjs -o -d bootstrap/ssr

      - name: PHPUnit
        run: php artisan test
