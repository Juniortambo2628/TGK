name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test & autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, xml, ctype, json, curl, tokenizer, openssl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy environment (testing)
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Prepare test database (sqlite)
        run: |
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env || true
          sed -i 's|^# DB_DATABASE=.*|DB_DATABASE='"$PWD"'/database/database.sqlite|' .env || true
          echo "DB_DATABASE=$PWD/database/database.sqlite" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          php artisan config:clear
          php artisan migrate --force

      - name: Laravel Pint (autofix)
        run: |
          vendor/bin/pint --test || true
          vendor/bin/pint || true

      - name: Commit Pint autofixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "style: apply Laravel Pint autofixes [skip ci]"
            git push
          fi

      - name: Frontend production build
        run: npm run build

      - name: Assert SEO/SSR artifacts
        run: |
          test -f public/build/manifest.json
          test -f bootstrap/ssr/index.mjs -o -d bootstrap/ssr

      - name: PHPUnit
        run: php artisan test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: app/public/build
          retention-days: 1

  deploy:
    name: Deploy to cPanel (FTP)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deploy site URL is configured
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "ERROR: set the repository variable DEPLOY_URL (e.g. http://app.goodkenyan.org)"
            exit 1
          fi
          echo "DEPLOY_URL=${DEPLOY_URL%/}"

      - name: Setup PHP (packaging)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, xml, ctype, json, curl, tokenizer, openssl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install system tools (lftp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Materialize production .env from secret
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -n "$PROD_ENV" ]; then
            printf '%s\n' "$PROD_ENV" > .env.production
            sed -i 's/\r$//' .env.production
            echo "Wrote .env.production from PROD_ENV secret"
          elif [ -f .env.production ]; then
            echo "Using local .env.production (should not be in git)"
          else
            echo "WARNING: PROD_ENV not set — remote .env will be used if present"
          fi

      - name: Package release (composer prod + stage)
        run: |
          chmod +x scripts/deploy/package-release.sh scripts/deploy/prepare-public.sh scripts/deploy/ftp-deploy.sh
          ./scripts/deploy/package-release.sh dist "${GITHUB_SHA::7}"
          ./scripts/deploy/prepare-public.sh dist/stage dist/public-docroot

      - name: Upload release over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
          FTP_CORE_DIR: ${{ secrets.FTP_CORE_DIR }}
          FTP_PUBLIC_DIR: ${{ secrets.FTP_PUBLIC_DIR }}
        run: ./scripts/deploy/ftp-deploy.sh

      - name: Run artisan deploy hook
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
          FTP_PUBLIC_DIR: ${{ secrets.FTP_PUBLIC_DIR }}
          CORE_PATH_REMOTE: ${{ secrets.CORE_PATH_REMOTE }}
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          FTP_PORT="${FTP_PORT:-21}"
          FTP_PUBLIC_DIR="${FTP_PUBLIC_DIR:-TGK-public}"
          CORE_PATH_REMOTE="${CORE_PATH_REMOTE:-/home/goodmshd/TGK-core}"
          HOOK_NAME="deploy-hook-${GITHUB_SHA::7}.php"
          TOKEN="$(openssl rand -hex 24)"
          SCHEME="ftp"
          CURL_SSL=""
          if [ "${FTP_SSL:-false}" = "true" ] || [ "${FTP_SSL:-false}" = "1" ]; then
            SCHEME="ftps"
            CURL_SSL="--ssl-reqd"
          fi

          # Build hook with token + core path injected
          sed -e "s|__CORE_PATH__|${CORE_PATH_REMOTE}|g" \
              -e "s|__HOOK_TOKEN__|${TOKEN}|g" \
              scripts/deploy/artisan-hook.php > "dist/${HOOK_NAME}"

          echo "Uploading ${HOOK_NAME}"
          curl --silent --show-error --fail $CURL_SSL \
            --user "${FTP_USER}:${FTP_PASS}" \
            --ftp-create-dirs \
            -T "dist/${HOOK_NAME}" \
            "${SCHEME}://${FTP_HOST}:${FTP_PORT}/${FTP_PUBLIC_DIR}/${HOOK_NAME}"

          # Give Apache a moment to see the new file
          sleep 2

          echo "Invoking hook"
          set +e
          RESP=$(curl -sS -o /tmp/hook.out -w '%{http_code}' --max-time 120 \
            "${DEPLOY_URL}/${HOOK_NAME}?token=${TOKEN}")
          set -e
          echo "HTTP ${RESP}"
          cat /tmp/hook.out || true

          # Always try to delete the hook (even on failure)
          curl --silent $CURL_SSL \
            --user "${FTP_USER}:${FTP_PASS}" \
            -Q "DELE ${FTP_PUBLIC_DIR}/${HOOK_NAME}" \
            "${SCHEME}://${FTP_HOST}:${FTP_PORT}/" >/dev/null 2>&1 || \
          curl --silent $CURL_SSL \
            --user "${FTP_USER}:${FTP_PASS}" \
            -Q "DELE ${HOOK_NAME}" \
            "${SCHEME}://${FTP_HOST}:${FTP_PORT}/${FTP_PUBLIC_DIR}/" >/dev/null 2>&1 || true

          if [ "$RESP" != "200" ]; then
            echo "ERROR: artisan hook failed (HTTP ${RESP})"
            exit 1
          fi
          grep -q 'DEPLOY HOOK OK' /tmp/hook.out || {
            echo "ERROR: hook did not report success"
            exit 1
          }

      - name: Smoke check public URL
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          sleep 5
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' -L --max-time 30 "$DEPLOY_URL/" || true)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Homepage did not return 200"
            head -c 2000 /tmp/home.html || true
            exit 1
          fi
          grep -qi 'Good Kenyan\|<!DOCTYPE html' /tmp/home.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$DEPLOY_URL/sitemap.xml" || true)
          echo "sitemap HTTP $code"
          [ "$code" = "200" ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$DEPLOY_URL/robots.txt" || true)
          echo "robots HTTP $code"
          [ "$code" = "200" ]
