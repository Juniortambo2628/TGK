name: Deploy (cPanel SSH)

# Runs after the "CI" workflow succeeds on main, then builds a production
# release and deploys it to cPanel over SSH (SCP upload + remote deploy script).
# Can also be run manually from the Actions tab.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    name: Build & deploy over SSH
    runs-on: ubuntu-latest
    # Only deploy when CI passed (or when dispatched manually).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout main (includes any Pint autofix commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify required deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then echo "::error::missing repository secret: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, xml, ctype, json, curl, tokenizer, openssl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Node deps & build production assets
        run: |
          npm ci
          npm run build

      - name: Materialize production .env from secret (optional)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -n "${PROD_ENV:-}" ]; then
            printf '%s\n' "$PROD_ENV" > .env.production
            sed -i 's/\r$//' .env.production
            echo "Wrote .env.production from PROD_ENV secret (uploaded only if server has no .env)"
          else
            echo "PROD_ENV not set — the server's existing TGK-core/.env will be used"
          fi

      - name: Package production release tarball
        run: |
          chmod +x scripts/deploy/package-release.sh scripts/deploy/server-deploy.sh
          ./scripts/deploy/package-release.sh dist "${GITHUB_SHA::7}"

      - name: Configure SSH key & known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          # Pin the host key (fall back to accept-new on first connect if scan fails)
          ssh-keyscan -T 15 -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release & run remote deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          CORE_DIR: ${{ secrets.DEPLOY_CORE_DIR }}
          PUBLIC_DIR: ${{ secrets.DEPLOY_PUBLIC_DIR }}
          PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SHA="${GITHUB_SHA::7}"
          ARCHIVE="dist/release-${SHA}.tar.gz"
          test -f "$ARCHIVE" || { echo "::error::release archive missing: $ARCHIVE"; exit 1; }

          KEY="$HOME/.ssh/deploy_key"
          KH="$HOME/.ssh/known_hosts"
          COMMON="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KH -o ConnectTimeout=30"
          SCP_OPTS="-i $KEY -P $PORT $COMMON"
          SSH_OPTS="-i $KEY -p $PORT $COMMON"

          STAMP="$(date +%s)"
          REMOTE_TAR="deploy-${SHA}-${STAMP}.tar.gz"
          REMOTE_RUNNER="deploy-runner-${SHA}-${STAMP}.sh"

          echo "==> Uploading release tarball and deploy script"
          scp $SCP_OPTS "$ARCHIVE" "$SSH_USER@$SSH_HOST:$REMOTE_TAR"
          scp $SCP_OPTS scripts/deploy/server-deploy.sh "$SSH_USER@$SSH_HOST:$REMOTE_RUNNER"

          # Build the remote env prefix; only pass overrides that are set so the
          # script's own defaults ($HOME/TGK-core, $HOME/TGK-public, php) apply.
          ENVV="RELEASE_ARCHIVE=\$HOME/$REMOTE_TAR RELEASE_ID=$SHA"
          [ -n "${CORE_DIR:-}" ]      && ENVV="$ENVV CORE_DIR=$CORE_DIR"
          [ -n "${PUBLIC_DIR:-}" ]    && ENVV="$ENVV PUBLIC_DIR=$PUBLIC_DIR"
          [ -n "${PHP_BIN:-}" ]       && ENVV="$ENVV PHP_BIN=$PHP_BIN"
          [ -n "${KEEP_RELEASES:-}" ] && ENVV="$ENVV KEEP_RELEASES=$KEEP_RELEASES"

          echo "==> Running remote deploy"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "$ENVV bash \$HOME/$REMOTE_RUNNER; rc=\$?; rm -f \$HOME/$REMOTE_RUNNER \$HOME/$REMOTE_TAR; exit \$rc"

      - name: Smoke check (HTTPS)
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -uo pipefail
          URL="${DEPLOY_URL:-https://goodkenyan.org}"
          URL="${URL%/}"
          echo "Smoke-checking $URL"
          sleep 5
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' -L --max-time 40 "$URL/" || echo 000)
          echo "homepage HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::homepage did not return 200"
            head -c 1500 /tmp/home.html || true
            exit 1
          fi
          grep -qi 'Good Kenyan\|<!DOCTYPE html' /tmp/home.html || echo "::warning::homepage body unexpected"
          for path in sitemap.xml robots.txt; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "$URL/$path" || echo 000)
            echo "$path HTTP $c"
            [ "$c" = "200" ] || echo "::warning::$path returned $c"
          done

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" 2>/dev/null || true
